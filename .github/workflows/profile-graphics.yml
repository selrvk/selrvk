name: profile-graphics

on:
  schedule:
    - cron: "0 16 * * *"   # daily, 00:00 Philippine time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-graphics.yml"
      - "scripts/build.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fonts and icons
        working-directory: scripts
        run: |
          npm pack -q @fontsource/bricolage-grotesque@5 @fontsource/jetbrains-mono@5 @fontsource/caveat@5 simple-icons@16
          for f in *.tgz; do mkdir -p "${f%.tgz}" && tar xzf "$f" -C "${f%.tgz}" --strip-components=1; done

      - run: pip install fonttools brotli skia-pathops

      # redraws the desktop date, the contribution skyline, repos and languages
      - run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A assets
          if git commit -m "Redraw profile graphics"; then
            git push
          fi
